<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e9efe5"><meta name="description" content="一只鹈鹕的海岸假日。进入可交互的三维世界，骑行、追光、听海，把忙碌留在身后。"><title>海风骑行 · 鹈鹕的慢游日记</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='86'%3E🚲%3C/text%3E%3C/svg%3E"></head><body>
<main id="app"><div id="scene" role="img" aria-label="戴着蓝绿头盔、系着红围巾的白色鹈鹕，在海岸公路骑珊瑚色自行车。拖拽可旋转，滚轮可缩放。"></div><div class="vignette"></div>
<header><a class="brand" href="./" aria-label="海风骑行首页"><span class="brand-mark"><i data-lucide="bike"></i></span><span>海风骑行<small>一只鹈鹕的慢游日记</small></span></a><div class="top-right"><span class="live-dot"></span><span>此刻，正好在路上</span><button id="sound" class="icon" aria-label="开启环境音" title="开启环境音"><i data-lucide="volume-x"></i></button></div></header>
<section class="hero"><p class="eyebrow"><span>001</span> 沿着海岸，漫无目的</p><h1>海风很轻。<br>骑慢<span class="accent">一点。</span></h1><p class="intro">今天没有目的地。<br>只有一只鹈鹕，和它喜欢的海。</p><button id="adventure" class="primary">去兜兜风 <span>↗</span></button><div class="hero-foot"><span class="line"></span>把时间，交给车轮。</div></section>
<div class="weather"><i data-lucide="sun" id="weather-icon"></i><span id="weather-label">晴日海风</span><span class="weather-line"></span><span>海岸公路</span></div>
<aside class="tools" aria-label="场景工具"><button class="icon" id="bell" aria-label="按车铃" title="按车铃 · B 键（车铃）"><i data-lucide="bell-ring"></i></button><button class="icon" id="photo" aria-label="保存照片" title="保存照片"><i data-lucide="camera"></i></button><button class="icon" id="cinema" aria-label="进入纯净画面" title="纯净画面"><i data-lucide="scan"></i></button><button class="icon" id="reset" aria-label="重置视角" title="重置视角"><i data-lucide="rotate-ccw"></i></button><button class="icon" id="fullscreen" aria-label="全屏" title="全屏"><i data-lucide="maximize"></i></button></aside>
<button id="exit-cinema">返回骑行面板 ↙</button>
<div class="scene-caption"><span class="tiny-star">✳</span><span>慢慢骑，也是一种超能力。</span></div>
<div class="customize" aria-label="自行车颜色"><span>我的单车</span><button data-color="#dd6c51" class="swatch coral" aria-label="珊瑚橙单车" aria-pressed="true"></button><button data-color="#288e83" class="swatch teal" aria-label="海盐绿单车" aria-pressed="false"></button><button data-color="#e5ba55" class="swatch yellow" aria-label="日光黄单车" aria-pressed="false"></button></div>
<div id="toast" role="status" aria-live="polite"></div><div id="loading"><span class="loader"></span><strong>海风正在赶来</strong><p>为你留一段慢下来的时光</p></div>
<footer><div class="ride"><button class="play" id="play" aria-label="暂停骑行" title="暂停骑行"><i data-lucide="pause"></i></button><div><span class="label" id="ride-state">自在骑行中</span><strong><span id="distance">0.00</span><small> 公里</small></strong></div></div><div class="control speed"><label for="speed">骑行速度 <output id="speed-label">18 公里/时</output></label><input id="speed" type="range" min="6" max="36" value="18" step="1"><div class="range-labels"><span>慢悠悠</span><span>追上风</span></div></div><div class="control"><span class="label">换个角度看世界</span><div class="segments" id="cameras"><button data-camera="follow" aria-pressed="true">追随</button><button data-camera="side" aria-pressed="false">侧面</button><button data-camera="orbit" aria-pressed="false">环绕</button></div></div><div class="control light"><span class="label">留住喜欢的光</span><div class="segments times" id="times"><button data-time="day" aria-label="晴日" aria-pressed="true" title="晴日"><i data-lucide="sun"></i><span>晴日</span></button><button data-time="sunset" aria-label="日落" aria-pressed="false" title="日落"><i data-lucide="sunset"></i><span>日落</span></button><button data-time="night" aria-label="月夜" aria-pressed="false" title="月夜"><i data-lucide="moon"></i><span>月夜</span></button></div></div></footer>
<div class="bottom-note"><span>拖拽环顾 · 滚轮缩放 · 空格暂停</span><span>不赶时间，只追海风 <span class="mini-bike">↗</span></span></div></main><script type="module" src="/src/main.js"></script></body></html>
